<div style="padding: 30px; font-family: sans-serif;">
  <!-- Task 11: String Interpolation -->
  <h1>Welcome to the {{ portalName }}</h1>
  <p>Track your academic progress, manage structural module schedules, and review overall enrollment milestones.</p>
  
  <!-- Task 12 & 13: Property Binding & Event Binding -->
  <div style="margin: 20px 0;">
    <button [disabled]="!isPortalActive" (click)="onEnrollClick()" style="padding: 10px 20px; cursor: pointer;">
      Enroll Now
    </button>
    <p *ngIf="message" style="color: #2ecc71; font-weight: bold; margin-top: 10px;">{{ message }}</p>
  </div>

  <!-- Task 14: Two-Way Data Binding using NgModel -->
  <div style="margin: 20px 0; background: #eee; padding: 15px; border-radius: 4px;">
    <label for="search" style="display: block; margin-bottom: 5px; font-weight: bold;">Quick Search Courses:</label>
    <input id="search" [(ngModel)]="searchTerm" placeholder="Type here..." style="padding: 8px; width: 250px;" />
    <!-- Task 15: Comment detailing core runtime architecture distinctions -->
    <!-- Note: [property] forces unidirectional synchronization going from Component Class to DOM element. -->
    <!-- Note: [(ngModel)] implements immediate bi-directional update tracking across both the DOM layout state and Component Logic models. -->
    <p style="margin-top: 8px;">Searching for: <em>{{ searchTerm }}</em></p>
  </div>
  
  <div style="display: flex; gap: 20px; margin-top: 25px;">
    <div style="background: #f8f9fa; padding: 20px; border-radius: 6px; border-left: 4px solid #3498db; flex: 1;">
      <h3>Courses Available</h3>
      <p style="font-size: 1.8rem; margin: 0; font-weight: bold;">12</p>
    </div>
    <div style="background: #f8f9fa; padding: 20px; border-radius: 6px; border-left: 4px solid #2ecc71; flex: 1;">
      <h3>Enrolled</h3>
      <p style="font-size: 1.8rem; margin: 0; font-weight: bold;">3</p>
    </div>
    <div style="background: #f8f9fa; padding: 20px; border-radius: 6px; border-left: 4px solid #f1c40f; flex: 1;">
      <h3>GPA</h3>
      <p style="font-size: 1.8rem; margin: 0; font-weight: bold;">3.8</p>
    </div>
  </div>
</div>
