<div style="max-width: 500px; margin: 40px auto; padding: 24px; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
  <h2 style="color: #2c3e50; margin-top: 0;">Template-Driven Course Enrollment</h2>
  
  <form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">
    <!-- Student Name -->
    <div style="margin-bottom: 16px;">
      <label style="display: block; margin-bottom: 6px; font-weight: bold;">Student Name:</label>
      <input type="text" name="name" [(ngModel)]="student.name" required minlength="3" #nameModel="ngModel"
             style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;"
             [style.border-color]="nameModel.invalid && nameModel.touched ? '#e74c3c' : '#ccc'">
      <small *ngIf="nameModel.invalid && nameModel.touched" style="color: #e74c3c;">Name is required (min 3 chars).</small>
    </div>

    <!-- Student Email -->
    <div style="margin-bottom: 16px;">
      <label style="display: block; margin-bottom: 6px; font-weight: bold;">Email Address:</label>
      <input type="email" name="email" [(ngModel)]="student.email" required email #emailModel="ngModel"
             style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;"
             [style.border-color]="emailModel.invalid && emailModel.touched ? '#e74c3c' : '#ccc'">
      <small *ngIf="emailModel.invalid && emailModel.touched" style="color: #e74c3c;">Please enter a valid email address.</small>
    </div>

    <!-- Course ID Select Selection -->
    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 6px; font-weight: bold;">Select Course ID:</label>
      <select name="courseId" [(ngModel)]="student.courseId" required #courseModel="ngModel"
              style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        <option value="">-- Choose a Module --</option>
        <option value="101">ECE-401 (Advanced Communication)</option>
        <option value="102">ECE-302 (Digital Signal Processing)</option>
        <option value="103">ECE-305 (Embedded Systems)</option>
      </select>
      <small *ngIf="courseModel.invalid && courseModel.touched" style="color: #e74c3c;">Please select a course module.</small>
    </div>

    <button type="submit" [disabled]="enrollForm.invalid" 
            style="width: 100%; background-color: #34495e; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold;">
      Submit Enrollment
    </button>
  </form>
</div>
