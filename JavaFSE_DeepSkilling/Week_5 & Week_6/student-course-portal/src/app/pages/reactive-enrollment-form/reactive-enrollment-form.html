<div style="max-width: 500px; margin: 40px auto; padding: 24px; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
  <h2 style="color: #2c3e50; margin-top: 0;">Reactive Multi-Course Form</h2>
  
  <form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">
    <!-- Student Name -->
    <div style="margin-bottom: 16px;">
      <label style="display: block; margin-bottom: 6px; font-weight: bold;">Student Name:</label>
      <input type="text" formControlName="studentName" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
      <small *ngIf="enrollForm.get('studentName')?.invalid && enrollForm.get('studentName')?.touched" style="color: #e74c3c;">
        Valid student name required (min 3 characters).
      </small>
    </div>

    <!-- Primary Course Code -->
    <div style="margin-bottom: 16px;">
      <label style="display: block; margin-bottom: 6px; font-weight: bold;">Primary Course Code:</label>
      <input type="text" formControlName="courseCode" placeholder="e.g., ECE-401" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
      <small *ngIf="enrollForm.get('courseCode')?.errors?.['forbiddenCode']" style="color: #e74c3c;">
        Codes beginning with 'XX' are invalid placeholder records!
      </small>
    </div>

    <!-- Dynamic FormArray Collection Section -->
    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 6px; font-weight: bold; display: flex; justify-content: space-between; align-items: center;">
        Elective Modules (FormArray):
        <button type="button" (click)="addCourseField()" style="background: #27ae60; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px;">
          + Add Elective
        </button>
      </label>

      <div formArrayName="additionalCourses">
        <div *ngFor="let control of additionalCourses.controls; let i = index;" style="display: flex; gap: 8px; margin-bottom: 8px;">
          <input [formControlName]="i" placeholder="Additional Course Code" style="flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 4px;">
          <button type="button" (click)="removeCourseField(i)" style="background: #c0392b; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer;">
            X
          </button>
        </div>
      </div>
    </div>

    <button type="submit" [disabled]="enrollForm.invalid" 
            style="width: 100%; background-color: #2c3e50; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold;">
      Submit Structural Data
    </button>
  </form>
</div>
